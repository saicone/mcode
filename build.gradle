subprojects {
    apply plugin: 'java'
    apply plugin: 'idea'
    apply plugin: 'java-library'

    apply from: "$rootDir/gradle/publish-config.gradle"

    description = project.name

    idea {
        module {
            downloadJavadoc = true
            downloadSources = true
        }
    }

    repositories {
        mavenCentral()
        maven { url = uri('https://jitpack.io') }
    }

    dependencies {
        compileOnly libs.annotations
    }

    compileJava {
        options.encoding = 'UTF-8'
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        withSourcesJar()
        withJavadocJar()
    }

    javadoc {
        options {
            links 'https://docs.oracle.com/en/java/javase/25/docs/api/'
            // annotations
            links "https://javadoc.io/doc/org.jetbrains/annotations/${libs.annotations.get().version}/"
        }
    }

    afterEvaluate {
        if (plugins.hasPlugin(libs.plugins.shadow.get().pluginId)) {
            jar {
                enabled = false
                dependsOn (shadowJar)
            }

            shadowJar {
                archiveClassifier.set('')
            }

            publishing {
                publications {
                    maven(MavenPublication) {
                        from components.shadow

                        artifact tasks.named('sourcesJar')
                        artifact tasks.named('javadocJar')
                    }
                }
            }
        } else {
            publishing {
                publications {
                    maven(MavenPublication) {
                        from components.java
                    }
                }
            }
        }
    }
}

def javadocProjects= [
        ':common',
        // Modules
        'module:module-command',
        'module:module-command-brigadier',
        'module:module-env',
        'module:module-lang',
        'module:module-lang-adventure',
        'module:module-task',
        // Platforms
        'platform:platform-bukkit',
        'platform:platform-bungee',
        'platform:platform-paper',
        'platform:platform-velocity',
        // Bootstrap
        'bootstrap',
        'bootstrap:bootstrap-annotations',
        'bootstrap:bootstrap-bukkit',
        'bootstrap:bootstrap-bungee',
        'bootstrap:bootstrap-paper',
        'bootstrap:bootstrap-velocity',
        // Extensions
        'extension:extension-cache'
]

def toolchains = project(javadocProjects.first())
        .extensions
        .getByType(org.gradle.jvm.toolchain.JavaToolchainService)

tasks.register('allJavadoc', Javadoc) {
    group = 'documentation'

    source javadocProjects.collect {
        project(it).sourceSets.main.allJava
    }
    classpath = files(
            javadocProjects.collect {
                project(it).sourceSets.main.compileClasspath
            }
    ) + files(
            javadocProjects.collect {
                project(it).configurations.findByName('compileOnlyWith')
            }.findAll { it != null }
    )
    javadocTool.set(toolchains.javadocToolFor {
        languageVersion.set(JavaLanguageVersion.of(25))
    })

    options {
        def allLinks = javadocProjects.collect { projectPath ->
            project(projectPath).javadoc.options.links
        }.flatten().unique()
        allLinks.each { link -> links link }
    }

    destinationDirectory = layout.buildDirectory.dir('docs/all-javadoc')
}